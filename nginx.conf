server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/html text/css application/javascript image/svg+xml image/x-icon application/json;

  # Fontes não mudam (se mudar, troque o nome do arquivo): 1 ano.
  location ~* \.woff2?$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
